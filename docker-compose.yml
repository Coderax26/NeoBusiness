version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neobus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: neobus_dev
      POSTGRES_USER: neobus
      POSTGRES_PASSWORD: neobus_dev_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-dev-db.sql:/docker-entrypoint-initdb.d/01-init-dev-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neobus -d neobus_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neobus_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: neobus_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
