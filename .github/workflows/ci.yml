name: CI

on:
  push:
    branches: [master, main, frontend_with_anitgravity, frontend_with_antigravity]
  pull_request:
    branches: [master, main, frontend_with_anitgravity, frontend_with_antigravity]

jobs:
  lint-test-build:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: neobus_test
          POSTGRES_USER: neobus
          POSTGRES_PASSWORD: neobus_test_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neobus -d neobus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://neobus:neobus_test_secret@localhost:5432/neobus_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
      JWT_REFRESH_SECRET: ci-refresh-ci-refresh-ci-refresh-ci-refresh-ci-refresh-ci
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run migrations (test DB)
        run: npx nest start --migration

      - name: Run unit tests
        run: npm test

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Check API routes drift
        working-directory: .
        run: npm run check:api-routes

      - name: Run frontend unit & tech stack tests
        working-directory: .
        run: npm run test:fe