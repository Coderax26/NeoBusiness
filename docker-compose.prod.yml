# Production & Pre-Production Stack for Coolify / Docker Compose
# Hardened non-root execution, healthchecks, resource limits, and clean client bootstrap.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neobus_prod}
      POSTGRES_USER: ${POSTGRES_USER:-neobus_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neobus_app} -d ${POSTGRES_DB:-neobus_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      APP_TZ: ${APP_TZ:-Asia/Kolkata}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-neobus_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neobus_prod}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-25}
      BOOTSTRAP_CLIENT: ${BOOTSTRAP_CLIENT:-true}
      BOOTSTRAP_SITE_NAME: ${BOOTSTRAP_SITE_NAME:-Primary Office & Warehouse}
      BOOTSTRAP_SITE_TYPE: ${BOOTSTRAP_SITE_TYPE:-OFFICE}
      BOOTSTRAP_SITE_ADDRESS: ${BOOTSTRAP_SITE_ADDRESS:-Head Office}
      BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME:-System Owner}
      BOOTSTRAP_OWNER_PHONE: ${BOOTSTRAP_OWNER_PHONE:-+919999999999}
      BOOTSTRAP_OWNER_PIN: ${BOOTSTRAP_OWNER_PIN:-123456}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOSTNAME: 0.0.0.0
      API_ORIGIN: http://api:3000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NEXT_PUBLIC_SHOW_DEMO_PERSONAS: ${NEXT_PUBLIC_SHOW_DEMO_PERSONAS:-false}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_prod_data:
  redis_prod_data:
